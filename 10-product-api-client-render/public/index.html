<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products</title>
<style>body{font-family:Arial;margin:30px;background:#f1f5f9}.wrap{max-width:800px;margin:auto;background:white;padding:24px;border-radius:12px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{padding:15px;border:1px solid #ddd;border-radius:8px}input,button{padding:10px;margin:5px 0}button{background:#2563eb;color:white;border:0;border-radius:5px}</style></head><body><main class="wrap"><h1>Product Store</h1><form id="form"><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" placeholder="Price" required><input id="rating" type="number" min="0" max="5" step=".1" placeholder="Rating" required><button>Add Product</button></form><p id="message"></p><section class="products" id="products"></section></main><script src="app.js"></script></body></html>
