<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Shop</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f8fafc;color:#172033}header{background:#172554;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.tabs button,button{border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:#2563eb;color:white;margin:3px}.tabs button{background:#334155}main{max-width:1100px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card,.panel{background:white;border-radius:12px;padding:15px;box-shadow:0 3px 12px #0001}.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}.price{font-weight:bold;color:#1d4ed8}.panel{margin:15px 0}input,textarea{display:block;width:100%;padding:10px;margin:8px 0;border:1px solid #cbd5e1;border-radius:6px}h2{margin-top:28px}.hidden{display:none}
</style></head><body><header><h1>Mini Shop</h1><nav class="tabs"><button onclick="show('shop')">Shop</button><button onclick="show('cart')">Cart (<span id="count">0</span>)</button><button onclick="show('orders')">My Orders</button><button onclick="show('seller')">Seller Panel</button></nav></header>
<main>
<section id="shop"><h2>All Products</h2><div id="products" class="grid"></div></section>
<section id="cart" class="hidden"><h2>Your Cart</h2><div id="cartItems"></div><button onclick="checkout()">Place order (mock checkout)</button><p id="cartMessage"></p></section>
<section id="orders" class="hidden"><h2>Successful order records</h2><p>Demo orders are recorded as placed, but are not paid.</p><div id="orderList"></div></section>
<section id="seller" class="hidden"><h2>Seller Master Panel</h2><div class="panel"><form id="productForm"><input id="pid" type="hidden"><input id="pname" placeholder="Product name" required><textarea id="pdesc" placeholder="Description"></textarea><input id="pprice" type="number" min="0" placeholder="Price" required><input id="pimage" placeholder="Image URL (optional)"><input id="pstock" type="number" min="0" value="10" placeholder="Stock"><button>Save product</button><button type="button" onclick="resetForm()">Clear</button></form></div><div id="sellerProducts" class="grid"></div></section>
</main><script src="app.js"></script></body></html>
