<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentric Circles</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font-family:Arial}
.circle{border-radius:50%;display:grid;place-items:center}
.outer{width:60px;height:60px;background:#ef4444}
.middle{width:40px;height:40px;background:#facc15}
.inner{width:20px;height:20px;background:#2563eb}
</style></head>
<body><div class="circle outer"><div class="circle middle"><div class="circle inner"></div></div></div></body>
</html>
